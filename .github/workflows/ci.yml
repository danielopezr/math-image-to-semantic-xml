name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests tools
          ruff format --check src tests tools
      - name: Tests
        run: python -m pytest -q

  typecheck:
    # Informative until the existing annotations are cleaned up: the job runs
    # mypy and reports the errors without failing the workflow.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" mypy types-requests types-PyYAML lxml-stubs
      - name: mypy
        run: python -m mypy src --ignore-missing-imports
